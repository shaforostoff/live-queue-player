plugins {
  id 'com.android.application'
}

android {
  namespace = 'com.shaforostoff.livequeueplayer'
  compileSdk = 36

  // Pinned rather than floating. The arm64/stub split keys off ANDROID_ABI, 16 KB page
  // alignment is the linker default from r28 on, and the analysis's numbers are checked
  // against a desktop build at one toolchain version - so a silent NDK bump is a silent
  // revalidation.
  ndkVersion = '28.2.13676358'

  defaultConfig {
    applicationId = 'com.shaforostoff.livequeueplayer'
    minSdk = 23
    targetSdk = 36

    externalNativeBuild {
      cmake {
        // Which FFT and at what width lives in CMakeLists.txt, so a plain
        // `cmake -S app/src/main/cpp` builds the same thing this does. The STL is the one
        // thing CMake cannot pick for itself: c++_static because there is exactly one .so
        // in the APK and so nothing to share a runtime with.
        arguments += ['-DANDROID_STL=c++_static']
      }
    }

    ndk {
      // Named rather than left to the NDK's default list, for two reasons. A future NDK
      // that adds an ABI must not silently start building for it; and armeabi-v7a and x86
      // must never be dropped by accident, because an APK with no .so for an ABI is
      // uninstallable there - which is the whole reason bpm_jni_stub.cpp exists.
      abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
    }
  }

  externalNativeBuild {
    cmake {
      path = file('src/main/cpp/CMakeLists.txt')
      version = '3.22.1'
    }
  }

  buildFeatures {
    // Generates BuildConfig.DEBUG, used to gate the boundary runtime assertions to debug builds
    // (stripped from release). See docs/testing-race-conditions.md (Step 5).
    buildConfig = true
  }

  /* just delete the signing configs if it doesn't work */
  signingConfigs {
    def keystorePropertiesFiles = rootProject.file("keystore.properties")
    def keystoreProperties = new java.util.Properties()
    keystoreProperties.load(new java.io.FileInputStream(keystorePropertiesFiles))

    basic {
      storeFile = file(keystoreProperties['storeFile'])
      storePassword = keystoreProperties['storePassword']
      keyAlias = keystoreProperties['keyAlias']
      keyPassword = keystoreProperties['keyPassword']
    }
  }

  buildTypes {
    release {
      minifyEnabled = true
      shrinkResources = true
      crunchPngs = false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      signingConfig = signingConfigs.basic
    }
    debug {
      signingConfig = signingConfigs.basic
    }
  }

  packaging {
    resources {
      // AGP 9 puts kotlin-stdlib on the runtime classpath even for a pure-Java app. R8 strips
      // every Kotlin class (the release dex contains none), but the stdlib's non-class resources
      // survive shrinking and cost ~13 KB of APK: kotlin/**/*.kotlin_builtins is metadata only
      // kotlin-reflect reads. Drop it; restore this if Kotlin code ever ships here.
      excludes += ['kotlin/**', 'META-INF/*.kotlin_module']
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  testOptions {
    unitTests {
      // Robolectric (Step 2) reads the merged manifest/resources from the built variant.
      includeAndroidResources = true
      // Let the few framework calls we don't drive return sane defaults instead of throwing.
      returnDefaultValues = true
    }
  }
}

dependencies {
  // Step 3 — pure-JVM model fuzzing. No Android on the classpath; runs on plain JUnit.
  testImplementation 'junit:junit:4.13.2'
  // Step 2 — Robolectric drives the real Service on a paused main looper, on the JVM.
  testImplementation 'org.robolectric:robolectric:4.13'
}
